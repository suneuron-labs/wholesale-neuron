# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "887f5834812eeebb06938e6c3f5de5a2"
name = "WholesaleNeuron"
application_url = "https://wholesale-neuron.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,write_validations,write_payment_customizations"

[discount.metafields.b2b_toolkit.settings]
name = "Wholesale settings"
description = "Customer tag, discount percent, and minimum order copied onto the wholesale pricing discount"
type = "json"

  [discount.metafields.b2b_toolkit.settings.access]
  admin = "merchant_read"

[discount.metafields.b2b_toolkit.function_variables]
name = "Wholesale function variables"
description = "Customer tag input for the wholesale pricing function"
type = "json"

  [discount.metafields.b2b_toolkit.function_variables.access]
  admin = "merchant_read"

[validation.metafields.b2b_toolkit.settings]
name = "Wholesale settings"
description = "Customer tag, discount percent, and minimum order copied onto the wholesale minimum order"
type = "json"

  [validation.metafields.b2b_toolkit.settings.access]
  admin = "merchant_read"

[validation.metafields.b2b_toolkit.function_variables]
name = "Wholesale function variables"
description = "Customer tag input for the wholesale minimum order function"
type = "json"

  [validation.metafields.b2b_toolkit.function_variables.access]
  admin = "merchant_read"

[payment_customization.metafields.b2b_toolkit.settings]
name = "Wholesale settings"
description = "Customer tag, discount percent, and minimum order copied onto the wholesale payment methods"
type = "json"

  [payment_customization.metafields.b2b_toolkit.settings.access]
  admin = "merchant_read"

[payment_customization.metafields.b2b_toolkit.function_variables]
name = "Wholesale function variables"
description = "Customer tag input for the wholesale payment methods function"
type = "json"

  [payment_customization.metafields.b2b_toolkit.function_variables.access]
  admin = "merchant_read"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://wholesale-neuron.vercel.app/auth/callback",
  "https://wholesale-neuron.vercel.app/auth/shopify/callback",
  "https://wholesale-neuron.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
